<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f5f7fb"/>
  <g font-family="Segoe UI, sans-serif">
    <text x="60" y="72" font-size="34" font-weight="700" fill="#182230">Phase 2 — データの流れ</text>
    <rect x="60" y="160" width="190" height="100" rx="18" fill="#17324d"/>
    <text x="112" y="218" font-size="22" fill="white">利用者</text>
    <path d="M250 210 H330" stroke="#49779f" stroke-width="5" marker-end="url(#a)"/>
    <rect x="335" y="135" width="250" height="150" rx="18" fill="white" stroke="#9eb3c7" stroke-width="2"/>
    <text x="397" y="190" font-size="22" fill="#17324d" font-weight="700">React画面</text>
    <text x="375" y="230" font-size="17" fill="#526579">入力・一覧・詳細</text>
    <path d="M585 210 H665" stroke="#49779f" stroke-width="5" marker-end="url(#a)"/>
    <rect x="670" y="135" width="220" height="150" rx="18" fill="#eaf2f8" stroke="#9eb3c7" stroke-width="2"/>
    <text x="718" y="190" font-size="22" fill="#17324d" font-weight="700">アプリ処理</text>
    <text x="710" y="230" font-size="17" fill="#526579">検証・検索・集計</text>
    <path d="M890 210 H970" stroke="#49779f" stroke-width="5" marker-end="url(#a)"/>
    <rect x="975" y="135" width="170" height="150" rx="18" fill="#e9f7ef" stroke="#83b99a" stroke-width="2"/>
    <text x="1002" y="188" font-size="20" fill="#21633e" font-weight="700">本人用</text>
    <text x="995" y="225" font-size="17" fill="#21633e">localStorage</text>
    <text x="1006" y="255" font-size="15" fill="#47735a">端末内のみ</text>
    <path d="M460 285 V405" stroke="#c28a3d" stroke-width="5" marker-end="url(#b)"/>
    <rect x="300" y="410" width="320" height="120" rx="18" fill="#fff4e8" stroke="#edb86a" stroke-width="2"/>
    <text x="363" y="458" font-size="21" fill="#7a4100" font-weight="700">公開デモデータ</text>
    <text x="353" y="495" font-size="17" fill="#7a5a34">架空データ・再読込で復元</text>
    <rect x="690" y="410" width="400" height="120" rx="18" fill="white" stroke="#ccd6e2" stroke-width="2"/>
    <text x="728" y="458" font-size="20" fill="#17324d" font-weight="700">将来: storageをAPIへ交換</text>
    <text x="728" y="495" font-size="16" fill="#526579">画面の大部分は維持できる</text>
    <text x="60" y="615" font-size="18" fill="#526579">外部送信なし / 課金なし / 公開デモと本人用を構造で分離</text>
  </g>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#49779f"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c28a3d"/></marker>
  </defs>
</svg>
