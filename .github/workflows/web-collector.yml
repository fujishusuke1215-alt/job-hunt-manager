name: Collect public recruitment pages
on:
  schedule: [{ cron: '17 21 * * *' }] # around 06:17 JST; schedule is best-effort
  workflow_dispatch:
    inputs: { dry_run: { description: 'Do not ingest findings', required: false, type: boolean, default: true } }
permissions: { contents: read }
concurrency: { group: web-collector, cancel-in-progress: false }
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: '22.x', cache: 'pnpm' }
      - run: npm install --global pnpm@11.19.0 && pnpm install --frozen-lockfile
      - run: pnpm run collector:dry-run
        env:
          COLLECTOR_DRY_RUN: ${{ inputs.dry_run || 'false' }}
          COLLECTOR_INGEST_URL: ${{ secrets.COLLECTOR_INGEST_URL }}
          COLLECTOR_WEB_TOKEN: ${{ secrets.COLLECTOR_WEB_TOKEN }}
